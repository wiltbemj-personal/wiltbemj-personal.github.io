<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Directory</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #24292f; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 24px; }
    .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; transition: border-color 0.2s; }
    .card:hover { border-color: #0969da; }
    .card h3 { margin-top: 0; font-size: 1.1rem; }
    .card a { color: #0969da; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .card p { font-size: 0.9rem; color: #57604a; }
  </style>
</head>
<body>
  <h1>Project Directory</h1>
  <p>Overview of active personal repositories and tools.</p>
  <div class="grid" id="repo-grid">Loading repositories...</div>

  <script>
    const username = '<username>'; // <-- Replace with your GitHub username

    async function loadRepos() {
      try {
        const res = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
        const repos = await res.json();
        const grid = document.getElementById('repo-grid');
        grid.innerHTML = '';

        repos
          .filter(repo => !repo.fork && repo.name !== `${username}.github.io`)
          .forEach(repo => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3><a href="${repo.html_url}" target="_blank">${repo.name}</a></h3>
              <p>${repo.description || 'No description provided.'}</p>
              ${repo.has_pages ? `<p><small><a href="https://${username}.github.io/${repo.name}/">Live Site &rarr;</a></small></p>` : ''}
            `;
            grid.appendChild(card);
          });
      } catch (err) {
        document.getElementById('repo-grid').innerText = 'Failed to load repositories.';
      }
    }
    loadRepos();
  </script>
</body>
</html>
